spring.application.name=erp-api
server.port=${PORT:8080}

spring.jackson.default-property-inclusion=non_null

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------------------
# PhaseDB
# ---------------------------------------------------------------------------
erp.phase.base-url=${ERP_PHASE_URL:http://127.0.0.1:8484}
erp.phase.username=${ERP_PHASE_USER:admin}
erp.phase.password=${ERP_PHASE_PASSWORD:admin123}
erp.phase.connect-timeout=3s
erp.phase.read-timeout=15s

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
erp.jwt.secret=${ERP_JWT_SECRET:erp-demo-secret-change-me-2026-11-03-please-use-32-bytes}
erp.jwt.expiration=8h
erp.jwt.issuer=erp-api

# ---------------------------------------------------------------------------
# Reglas de negocio (moneda e IVA configurables)
# ---------------------------------------------------------------------------
erp.finance.currency=${ERP_CURRENCY:USD}
erp.finance.iva-rate=${ERP_IVA_RATE:0.00}
erp.validation.rut-dv=${ERP_RUT_DV:false}

# ---------------------------------------------------------------------------
# CORS (frontend estatico)
# ---------------------------------------------------------------------------
erp.cors.allowed-origins=${ERP_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080}

# ---------------------------------------------------------------------------
# Seed y migracion (idempotentes)
# ---------------------------------------------------------------------------
erp.seed.enabled=${ERP_SEED_ENABLED:true}
erp.seed.admin-email=${ERP_SEED_ADMIN_EMAIL:admin@empresa.com}
erp.seed.admin-password=${ERP_SEED_ADMIN_PASSWORD:admin123}
erp.seed.admin-name=${ERP_SEED_ADMIN_NAME:Administrador}
erp.seed.admin-apellidos=${ERP_SEED_ADMIN_APELLIDOS:ERP}

erp.migration.enabled=${ERP_MIGRATION_ENABLED:true}
erp.migration.clientes=${ERP_MIGRATION_CLIENTES:true}

logging.level.com.phase.api=INFO
