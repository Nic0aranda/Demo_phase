spring.application.name=erp-api
server.port=${PORT:8080}

# Perfil por defecto para la demo local. En produccion usar --spring.profiles.active=prod.
spring.profiles.default=dev

spring.jackson.default-property-inclusion=non_null

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------------------
# PhaseDB
# ---------------------------------------------------------------------------
erp.phase.base-url=${ERP_PHASE_URL:http://127.0.0.1:8484}
erp.phase.connect-timeout=3s
erp.phase.read-timeout=15s

# ---------------------------------------------------------------------------
# JWT (el secreto y las credenciales de Phase se definen por perfil)
# ---------------------------------------------------------------------------
erp.jwt.expiration=8h
erp.jwt.issuer=erp-api

# ---------------------------------------------------------------------------
# Reglas de negocio (moneda e IVA configurables)
# ---------------------------------------------------------------------------
erp.finance.currency=${ERP_CURRENCY:USD}
erp.finance.iva-rate=${ERP_IVA_RATE:0.00}
erp.validation.rut-dv=${ERP_RUT_DV:false}

# ---------------------------------------------------------------------------
# Seed y migracion (desactivados por defecto; dev los activa)
# ---------------------------------------------------------------------------
erp.seed.enabled=false
erp.migration.enabled=false

# ---------------------------------------------------------------------------
# Archivos adjuntos de documentos de operaciones
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=${ERP_UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${ERP_UPLOAD_MAX_REQUEST_SIZE:11MB}
erp.uploads.dir=${ERP_UPLOADS_DIR:uploads}
erp.uploads.max-bytes=${ERP_UPLOAD_MAX_BYTES:10485760}

# ---------------------------------------------------------------------------
# Locks e idempotencia
# ---------------------------------------------------------------------------
erp.locks.timeout-ms=${ERP_LOCK_TIMEOUT_MS:5000}
erp.idempotencia.espera-ms=${ERP_IDEMPOTENCIA_ESPERA_MS:10000}
erp.idempotencia.ttl-seconds=${ERP_IDEMPOTENCIA_TTL_SECONDS:86400}
erp.idempotencia.ventana-corta-seconds=${ERP_IDEMPOTENCIA_VENTANA_CORTA_SECONDS:30}

logging.level.com.phase.api=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n
