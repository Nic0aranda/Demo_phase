# Perfil de produccion. Las variables sin valor por defecto son obligatorias:
# ERP_JWT_SECRET, ERP_PHASE_USER, ERP_PHASE_PASSWORD y ERP_CORS_ORIGINS.

erp.phase.username=${ERP_PHASE_USER}
erp.phase.password=${ERP_PHASE_PASSWORD}
erp.jwt.secret=${ERP_JWT_SECRET}
erp.jwt.expiration=${ERP_JWT_EXPIRATION:8h}
erp.jwt.issuer=${ERP_JWT_ISSUER:erp-api}

erp.seed.enabled=false
erp.migration.enabled=${ERP_MIGRATION_ENABLED:false}

erp.cors.allowed-origins=${ERP_CORS_ORIGINS}

# Swagger y OpenAPI no se exponen en produccion.
erp.security.swagger-public=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# La revalidacion de usuarios y el bloqueo de login son obligatorios en prod.
erp.security.user-cache-ttl=${ERP_USER_CACHE_TTL:30s}
erp.security.user-cache-stale=${ERP_USER_CACHE_STALE:5m}
erp.security.login.max-attempts=${ERP_LOGIN_MAX_ATTEMPTS:5}
erp.security.login.window=${ERP_LOGIN_WINDOW:15m}
erp.security.login.lockout=${ERP_LOGIN_LOCKOUT:15m}
