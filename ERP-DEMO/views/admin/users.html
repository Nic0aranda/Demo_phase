<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios - ERP Empresarial</title>
    <link rel="stylesheet" href="../../CSS/Main.css">
    <link rel="stylesheet" href="../../CSS/layout.css">
    <link rel="stylesheet" href="../../CSS/components.css">
</head>
<body data-page="usuarios" data-require-role="admin">

    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="topbar">
                <div class="header-titles">
                    <span class="badge">TIPO DE CUENTA</span>
                    <h1>Gestión de usuarios</h1>
                    <p>Administra las cuentas, roles, estados y permisos del sistema.</p>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <input type="search" id="usuarioSearch" placeholder="Buscar nombre, email o permiso…"
                            aria-label="Buscar usuarios">
                    </div>
                    <select id="usuarioRol" aria-label="Filtrar por rol" style="width:160px;">
                        <option value="">Todos los roles</option>
                        <option value="admin">Administrador</option>
                        <option value="comercial">Comercial</option>
                        <option value="operaciones">Operaciones</option>
                        <option value="contabilidad">Contabilidad</option>
                    </select>
                    <select id="usuarioEstado" aria-label="Filtrar por estado" style="width:140px;">
                        <option value="">Todos los estados</option>
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                    <button type="button" id="recalcularBtn" class="btn-secondary">Recalcular estados</button>
                    <a href="crear-usuario.html" class="btn-primary">+ Nuevo usuario</a>
                </div>
            </header>

            <section id="usuariosResumen" class="kpi-cards mb-20"></section>

            <section class="card table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>USUARIO</th>
                            <th>ROL</th>
                            <th>ESTADO</th>
                            <th>PERMISOS</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="usuariosTableBody">
                        <tr><td colspan="5" class="table-message">Cargando usuarios…</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script type="module" src="../../dist/main.js"></script>
</body>
</html>
