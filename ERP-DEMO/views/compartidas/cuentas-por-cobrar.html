<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas por cobrar - ERP Empresarial</title>
    <link rel="stylesheet" href="../../CSS/Main.css">
    <link rel="stylesheet" href="../../CSS/layout.css">
    <link rel="stylesheet" href="../../CSS/components.css">
</head>
<body data-page="cartera">

    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="topbar">
                <div class="header-titles">
                    <span class="badge">TIPO DE CUENTA</span>
                    <h1>Cuentas por cobrar</h1>
                    <p>Cartera derivada de facturas, pagos y notas de crédito.</p>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <input type="search" id="carteraSearch" placeholder="Buscar factura, cliente o RUT…"
                            aria-label="Buscar cuentas por cobrar">
                    </div>
                    <select id="carteraEstado" aria-label="Filtrar por estado" style="width:170px;">
                        <option value="">Todos los estados</option>
                        <option value="AL_DIA">Al día</option>
                        <option value="POR_VENCER">Por vencer</option>
                        <option value="ATRASADO">Atrasado</option>
                        <option value="CRITICO">Crítico</option>
                        <option value="PAGADA">Pagada</option>
                    </select>
                    <a href="gestion-cobranza.html" class="btn-secondary">Gestión de cobranza</a>
                </div>
            </header>

            <section id="carteraKpis" class="kpi-cards mb-20"></section>

            <section class="card table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>CLIENTE</th>
                            <th>FACTURA</th>
                            <th>EMISIÓN</th>
                            <th>VENCIMIENTO</th>
                            <th>TOTAL</th>
                            <th>PAGADO</th>
                            <th>PENDIENTE</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="carteraTableBody">
                        <tr><td colspan="9" class="table-message">Cargando cartera…</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script type="module" src="../../dist/main.js"></script>
</body>
</html>
