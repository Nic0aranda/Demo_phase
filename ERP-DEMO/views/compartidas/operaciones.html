<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones - ERP Empresarial</title>
    <link rel="stylesheet" href="../../CSS/Main.css">
    <link rel="stylesheet" href="../../CSS/layout.css">
    <link rel="stylesheet" href="../../CSS/components.css">
</head>
<body data-page="operaciones">

    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="topbar">
                <div class="header-titles">
                    <span class="badge">TIPO DE CUENTA</span>
                    <h1>Operaciones</h1>
                    <p>Seguimiento logístico de importaciones, exportaciones y operaciones nacionales.</p>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <input type="search" id="operacionSearch" placeholder="Buscar operación, cliente o referencia…"
                            aria-label="Buscar operaciones">
                    </div>
                    <a href="crear-operaciones.html" class="btn-primary" data-write-roles="admin,operaciones">+ Nueva operación</a>
                </div>
            </header>

            <section id="operacionesResumen" class="kpi-cards mb-20"></section>

            <section class="card table-card">
                <table class="data-table ops-table">
                    <thead>
                        <tr>
                            <th>OPERACIÓN</th>
                            <th>CLIENTE</th>
                            <th>DOCUMENTO</th>
                            <th>TIPO</th>
                            <th>VÍA</th>
                            <th>FACTURA</th>
                            <th>BL / AWB</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="operacionesTableBody">
                        <tr><td colspan="9" class="table-message">Cargando operaciones…</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <div class="modal-overlay" id="docsModal" aria-hidden="true">
        <div class="modal-content modal-large" role="dialog" aria-modal="true" aria-labelledby="docsModalTitle">
            <div class="modal-header">
                <h2 id="docsModalTitle">Documentos de la operación</h2>
                <button type="button" class="close-modal" data-close-modal aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body" id="docsModalBody"></div>
        </div>
    </div>

    <script type="module" src="../../dist/main.js"></script>
</body>
</html>
