<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas de crédito - ERP Empresarial</title>
    <link rel="stylesheet" href="../../CSS/Main.css">
    <link rel="stylesheet" href="../../CSS/layout.css">
    <link rel="stylesheet" href="../../CSS/components.css">
</head>
<body data-page="notas">

    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="topbar">
                <div class="header-titles">
                    <span class="badge">TIPO DE CUENTA</span>
                    <h1>Notas de crédito</h1>
                    <p>Emite y anula notas que rebajan el saldo de las facturas.</p>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <input type="search" id="notaSearch" placeholder="Buscar nota, factura o cliente…"
                            aria-label="Buscar notas de crédito">
                    </div>
                    <select id="notaTipoFilter" aria-label="Filtrar por tipo" style="width:170px;">
                        <option value="">Todos los tipos</option>
                        <option value="ANULACION">Anulación</option>
                        <option value="DESCUENTO">Descuento</option>
                        <option value="DEVOLUCION">Devolución</option>
                    </select>
                    <a href="crear-nota-credito.html" class="btn-primary" data-write-roles="admin,contabilidad">+ Nueva nota</a>
                </div>
            </header>

            <section id="notasKpis" class="kpi-cards mb-20"></section>

            <section class="card table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>NOTA</th>
                            <th>FACTURA</th>
                            <th>CLIENTE</th>
                            <th>TIPO</th>
                            <th>MONTO NETO</th>
                            <th>TOTAL</th>
                            <th>FECHA</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="notasTableBody">
                        <tr><td colspan="9" class="table-message">Cargando notas de crédito…</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script type="module" src="../../dist/main.js"></script>
</body>
</html>
