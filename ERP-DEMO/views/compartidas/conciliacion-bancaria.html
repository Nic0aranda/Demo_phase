<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conciliación bancaria - ERP Empresarial</title>
    <link rel="stylesheet" href="../../CSS/Main.css">
    <link rel="stylesheet" href="../../CSS/layout.css">
    <link rel="stylesheet" href="../../CSS/components.css">
</head>
<body data-page="conciliacion">

    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="topbar">
                <div class="header-titles">
                    <span class="badge">TIPO DE CUENTA</span>
                    <h1>Conciliación bancaria</h1>
                    <p>Compara los movimientos del banco simulado con los documentos del ERP.</p>
                </div>
                <div class="header-actions">
                    <button type="button" id="simularConciliacion" class="btn-secondary">Simular movimientos</button>
                    <button type="button" id="ejecutarConciliacion" class="btn-primary">Conciliar automáticamente</button>
                </div>
            </header>

            <section id="conciliacionKpis" class="kpi-cards mb-20"></section>

            <section class="card table-card">
                <div class="table-card-header">
                    <div>
                        <h3>Movimientos bancarios</h3>
                        <p>Solo administradores y contabilidad pueden simular, ejecutar y conciliar.</p>
                    </div>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>FECHA</th>
                            <th>CONCEPTO</th>
                            <th>MONTO</th>
                            <th>DOCUMENTO ERP</th>
                            <th>ORIGEN</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="conciliacionTableBody">
                        <tr><td colspan="7" class="table-message">Cargando conciliación…</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script type="module" src="../../dist/main.js"></script>
</body>
</html>
