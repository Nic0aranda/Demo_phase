<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - ERP Empresarial</title>
    <link rel="stylesheet" href="../../CSS/Main.css">
    <link rel="stylesheet" href="../../CSS/layout.css">
    <link rel="stylesheet" href="../../CSS/components.css">
</head>
<body data-page="clientes">

    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="topbar">
                <div class="header-titles">
                    <span class="badge">TIPO DE CUENTA</span>
                    <h1>Clientes</h1>
                    <p>Administra la cartera de clientes y sus datos de contacto.</p>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <input type="search" id="clienteSearch" placeholder="Buscar por nombre, RUT o email…"
                            aria-label="Buscar clientes">
                    </div>
                    <a href="crear-cliente.html" class="btn-primary" data-write-roles="admin,comercial">+ Nuevo cliente</a>
                </div>
            </header>

            <section id="clientesResumen" class="kpi-cards mb-20"></section>

            <section class="card table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>CLIENTE</th>
                            <th>DOCUMENTO</th>
                            <th>CONTACTO</th>
                            <th>REGIÓN</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="clientesTableBody">
                        <tr><td colspan="6" class="table-message">Cargando clientes…</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script type="module" src="../../dist/main.js"></script>
</body>
</html>
