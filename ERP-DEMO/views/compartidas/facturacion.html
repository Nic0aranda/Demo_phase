<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación - ERP Empresarial</title>
    <link rel="stylesheet" href="../../CSS/Main.css">
    <link rel="stylesheet" href="../../CSS/layout.css">
    <link rel="stylesheet" href="../../CSS/components.css">
</head>
<body data-page="facturacion">

    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="topbar">
                <div class="header-titles">
                    <span class="badge">TIPO DE CUENTA</span>
                    <h1>Facturación</h1>
                    <p>Emite facturas, revisa su detalle y registra pagos de clientes.</p>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <input type="search" id="facturaSearch" placeholder="Buscar por factura, cliente o RUT…"
                            aria-label="Buscar facturas">
                    </div>
                    <select id="facturaEstado" class="filter-select" aria-label="Filtrar por estado" style="width:170px;">
                        <option value="">Todos los estados</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="PAGADA">Pagada</option>
                        <option value="VENCIDA">Vencida</option>
                        <option value="ANULADA">Anulada</option>
                    </select>
                    <a href="crear-factura.html" class="btn-primary" data-write-roles="admin,contabilidad">+ Nueva factura</a>
                </div>
            </header>

            <section id="facturacionKpis" class="kpi-cards mb-20"></section>

            <section class="card table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>FACTURA</th>
                            <th>CLIENTE</th>
                            <th>EMISIÓN</th>
                            <th>VENCIMIENTO</th>
                            <th>TOTAL</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="facturasTableBody">
                        <tr><td colspan="7" class="table-message">Cargando facturas…</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <div class="modal-overlay" id="invoiceModal" aria-hidden="true">
        <div class="modal-content modal-large" role="dialog" aria-modal="true" aria-labelledby="invoiceModalTitle">
            <div class="modal-header">
                <h2 id="invoiceModalTitle">Detalle de factura</h2>
                <button type="button" class="close-modal" data-close-modal aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body" id="invoiceModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" data-close-modal>Cerrar</button>
                <button type="button" class="btn-secondary" id="invoiceEmailBtn">Enviar por email</button>
                <button type="button" class="btn-secondary" id="invoicePdfBtn">Descargar PDF</button>
                <button type="button" class="btn-primary" id="invoicePayBtn" hidden>Registrar pago</button>
            </div>
        </div>
    </div>

    <script type="module" src="../../dist/main.js"></script>
</body>
</html>
