<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - ERP Empresarial</title>
    <link rel="stylesheet" href="CSS/Main.css">
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="CSS/components.css">
</head>
<body data-page="login">

    <div class="login-container">
        <div class="login-branding">
            <h2>ERP EMPRESARIAL</h2>
            <p>Gestiona clientes, operaciones, facturación y cobranza desde un solo lugar.</p>
        </div>

        <div class="login-form-section">
            <h1>Bienvenido de nuevo</h1>
            <p class="subtitle">Introduce tus credenciales para acceder a tu espacio de trabajo.</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="nombre@empresa.com"
                        autocomplete="username" maxlength="120" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Introduce tu contraseña"
                        autocomplete="current-password" maxlength="72" required>
                </div>

                <div id="errorMessage" class="login-error" role="alert"></div>

                <button type="submit" id="loginBtn" class="btn-login">Iniciar sesión</button>
            </form>

            <div class="security-notice">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Tus datos se transmiten de forma segura y cifrada.</span>
            </div>
        </div>
    </div>

    <script type="module" src="dist/main.js"></script>
</body>
</html>
