<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-branding">
            <img src="" alt="Logo de la empresa">
        </div>

        <!-- Form login-->
        <div class="login-form-section">
            <h1>Bienvenido de nuevo</h1>
            <p class="subtitle">Introduce tus credenciales para acceder a tu espacio de trabajo.</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="nombre@empresa.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Introduce tu contraseña" required>
            </div>

            <div class="form-options">
                <a href="#" class="forgot-password">¿Has olvidado tu contraseña?</a>
            </div>

            <!--mensajes de error-->
            <div id="errorMessage" style="color: #e74c3c; font-size: 13px; margin-bottom: 15px; display: none;">
                Credenciales incorrectas.
            </div>

            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

            <div class="security-notice">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Tus datos se transmiten de forma segura y cifrada.</span>
            </div>
        </div>
    </div>
    <script src="JS/auth.js"></script>
</body>
</html>
